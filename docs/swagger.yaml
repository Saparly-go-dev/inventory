basePath: /
definitions:
  handler.errorResponse:
    properties:
      message:
        type: string
    type: object
  handler.signInInput:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.statusResponse:
    properties:
      status:
        type: string
    type: object
  models.Change_Password:
    properties:
      confirm_password:
        type: string
      old_password:
        type: string
      password:
        type: string
      user_id:
        type: integer
    type: object
  models.CreateUser:
    properties:
      confirm_password:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      role:
        type: string
      surname:
        type: string
      username:
        type: string
    type: object
  models.UpdateBrand:
    properties:
      description:
        type: string
      info:
        type: string
      name:
        type: string
    type: object
  models.UpdateModel:
    properties:
      brand_id:
        type: integer
      description:
        type: string
      name:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      role:
        type: string
      status:
        type: boolean
      surname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
info:
  contact: {}
  description: API Server for Documentation
  title: Inventory App API
  version: "1.0"
paths:
  /api/auth/signIn:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns a JWT token
      parameters:
      - description: Login Credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.signInInput'
      produces:
      - application/json
      responses:
        "200":
          description: token response
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Sign In
      tags:
      - auth
  /api/brands:
    delete:
      consumes:
      - application/json
      description: Deletes a brand by ID
      parameters:
      - description: Brand ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid ID parameter
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete brand
      tags:
      - brands
    get:
      consumes:
      - application/json
      description: Returns a paginated list of brands, optionally filtered by name
      parameters:
      - description: Number of items per page
        in: query
        name: page_size
        required: true
        type: integer
      - description: Page number to retrieve
        in: query
        name: page_number
        required: true
        type: integer
      - description: Filter by brand name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of brands
          schema:
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get paginated brands
      tags:
      - brands
    put:
      consumes:
      - application/json
      description: Updates an existing brand with the provided data
      parameters:
      - description: Brand ID
        in: query
        name: id
        required: true
        type: integer
      - description: Brand update data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBrand'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid input data or ID
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update brand
      tags:
      - brands
  /api/brands/:
    post:
      consumes:
      - application/json
      description: Creates a new brand with the provided data
      parameters:
      - description: Brand creation data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBrand'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create a new brand
      tags:
      - brands
  /api/brands/selected:
    get:
      consumes:
      - application/json
      description: Returns brands filtered by selected object name
      parameters:
      - description: Selected object name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of brands
          schema:
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get brands by selected object
      tags:
      - brands
  /api/models:
    delete:
      consumes:
      - application/json
      description: Deletes a model by ID
      parameters:
      - description: Model ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid ID parameter
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete model
      tags:
      - models
    get:
      consumes:
      - application/json
      description: Returns a paginated list of models, optionally filtered by name
      parameters:
      - description: Number of items per page
        in: query
        name: page_size
        required: true
        type: integer
      - description: Page number to retrieve
        in: query
        name: page_number
        required: true
        type: integer
      - description: Filter by model name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of models
          schema:
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get paginated models
      tags:
      - models
    post:
      consumes:
      - application/json
      description: Creates a new model with the provided data
      parameters:
      - description: Model creation data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UpdateModel'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create a new model
      tags:
      - models
    put:
      consumes:
      - application/json
      description: Updates an existing model with the provided data
      parameters:
      - description: Model ID
        in: query
        name: id
        required: true
        type: integer
      - description: Model update data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UpdateModel'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Invalid input data or ID
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update model
      tags:
      - models
  /api/models/selected:
    get:
      consumes:
      - application/json
      description: Returns models filtered by selected object name
      parameters:
      - description: Selected object name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of models
          schema:
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get models by selected object
      tags:
      - models
  /api/users:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of users
      parameters:
      - description: Page Size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: Page Number
        in: query
        name: pageNumber
        required: true
        type: integer
      - description: User Name
        in: query
        name: name
        type: string
      - description: User Surname
        in: query
        name: surname
        type: string
      - description: User Patronymic
        in: query
        name: patronymic
        type: string
      - description: Username
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get Users Page
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user
      parameters:
      - description: User Info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.CreateUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create User
      tags:
      - users
  /api/users/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete User
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user's data
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated User Info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.CreateUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
